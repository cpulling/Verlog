# GENERATED from the CORA tool schema (ARC_Game repo, cora/tools.py) — do not edit by hand.
# The same tools the CORA benchmark and the GUI officers use. ArcEnvTool is schema-only: Verlog's
# tool_agent_loop parses the model's <tool_call> blocks and CoraEnv executes them (cora.executor).
# Task-only transfers (CoraEnvConfig.manual_transfers=False). Regenerate, from ARC_Game_New:
#   python -c "from cora.tools import arc_tools_yaml; print(arc_tools_yaml(manual_transfers=False))"
tools:
- class_name: verl.tools.arc_env_tool.ArcEnvTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: build
      description: Start construction of a new building at an available site.
      parameters:
        type: object
        properties:
          type:
            type: string
            enum:
            - kitchen
            - shelter
            - casework
            description: The building type to construct.
          site_id:
            type: integer
            description: An integer site id from `available.buildSites` this turn.
        required:
        - type
        - site_id
- class_name: verl.tools.arc_env_tool.ArcEnvTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: hire
      description: Hire N workers of the given kind.
      parameters:
        type: object
        properties:
          kind:
            type: string
            enum:
            - untrained
            - trained
            description: 'untrained: 1 workforce unit at `costs.hireUntrained`. trained: 2 workforce units
              at `costs.hireTrained`. Both prices print under `costs:` each turn.'
          count:
            type: integer
            description: Number of workers to hire, 1-127.
        required:
        - kind
        - count
- class_name: verl.tools.arc_env_tool.ArcEnvTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: train
      description: Train N of your existing untrained workers into trained workers.
      parameters:
        type: object
        properties:
          count:
            type: integer
            description: Number of untrained workers to promote to trained, 1-127.
        required:
        - count
- class_name: verl.tools.arc_env_tool.ArcEnvTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: staff
      description: 'Staff an already-built facility from the free pool. A building only runs when FULLY
        staffed, so normally omit count and it is staffed with exactly the workforce it needs (trained
        workers count 2 units, untrained 1). Workers hired this turn are not free yet: they arrive a few
        rounds later (listed as arriving).'
      parameters:
        type: object
        properties:
          site:
            type: string
            description: The facility name, copied exactly as printed in `available.needStaff` this turn
              (names look like 'Shelter Alpha', 'Kitchen Bravo', 'Casework Charlie'). Matching is case-insensitive
              substring. A facility not listed in `needStaff` is either fully staffed or not yet built,
              and the call is dropped.
          count:
            type: integer
            description: 'Optional, in workforce UNITS (not workers): trained = 2 units, untrained = 1.
              Leave it out to staff fully. A count below the building''s need is refused, because partial
              staffing is not allowed.'
        required:
        - site
- class_name: verl.tools.arc_env_tool.ArcEnvTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: deconstruct
      description: Tear down an existing building. Frees the site and refunds nothing.
      parameters:
        type: object
        properties:
          site:
            type: string
            description: The facility name, copied exactly as printed in this turn's facilities list (e.g.
              'Shelter Alpha'). Matching is case-insensitive substring.
        required:
        - site
- class_name: verl.tools.arc_env_tool.ArcEnvTool
  config:
    type: native
  tool_schema:
    type: function
    function:
      name: task
      description: Respond to an active task by selecting one of its offered choices. Tasks and their
        choices are enumerated at the top of each observation.
      parameters:
        type: object
        properties:
          task_id:
            type: string
            description: "The task's id string, copied exactly as shown in this turn's observation (e.g.\
              \ BUDGET_DAILY). Must match a task actually offered this turn \u2014 ids not listed this\
              \ turn are dropped."
          choice_id:
            type: integer
            description: "The integer choice_id printed for that choice in this turn's task list. Ids\
              \ are not 0-based and not contiguous \u2014 a task may offer only {1,3}. Use exactly the\
              \ ids shown for that task this turn."
        required:
        - task_id
        - choice_id
